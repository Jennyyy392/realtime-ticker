services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: realtime_ticker_api
    ports:
      - "8001:8000"  # <--- ВАЖНО: 8001 снаружи, 8000 внутри
    environment:
      - REDIS_HOST=redis
      - DEBUG=False
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # <--- ЗДЕСЬ НЕ ДОЛЖНО БЫТЬ СЕКЦИИ volumes:

  redis:
    image: redis:7-alpine
    container_name: realtime_ticker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data: