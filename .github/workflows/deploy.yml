name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Полностью удаляем старую папку, чтобы исключить любые ошибки Git
          rm -rf ~/realtime-ticker
          
          # 2. Клонируем репозиторий начисто (токен GitHub позволяет клонировать даже приватные репо)
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Jennyyy392/realtime-ticker.git ~/realtime-ticker
          
          # 3. Переходим в папку проекта
          cd ~/realtime-ticker
          
          # 4. Запускаем Docker (используем docker-compose с дефисом для совместимости с v1.29.2)
          docker-compose -f docker/docker-compose.yml up -d --build