name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Полностью удаляем старую папку
          rm -rf ~/realtime-ticker
          
          # 2. Клонируем репозиторий начисто
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Jennyyy392/realtime-ticker.git ~/realtime-ticker
          
          # 3. Переходим в папку проекта
          cd ~/realtime-ticker
          
          # 4. Изолированно останавливаем и удаляем старые контейнеры ТОЛЬКО этого проекта (игнорируем ошибки, если их нет)
          docker-compose -p realtime_ticker -f docker/docker-compose.yml down --remove-orphans || true
          
          # 5. Запускаем сборку и старт с явным указанием имени проекта (это предотвращает конфликт со smartmonitor)
          docker-compose -p realtime_ticker -f docker/docker-compose.yml up -d --build