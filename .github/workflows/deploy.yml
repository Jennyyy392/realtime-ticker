name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Полностью удаляем старую папку с кодом
          rm -rf ~/realtime-ticker
          
          # 2. Клонируем репозиторий начисто
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Jennyyy392/realtime-ticker.git ~/realtime-ticker
          
          # 3. Переходим в папку проекта
          cd ~/realtime-ticker
          
          # 4. ЖЕСТКО удаляем любые контейнеры с этими именами, чтобы исключить конфликты (игнорируем ошибки, если их нет)
          docker rm -f realtime_ticker_api realtime_ticker_redis || true
          
          # 5. Очищаем старые сети и тома этого проекта (на всякий случай)
          docker-compose -p realtime_ticker -f docker/docker-compose.yml down --remove-orphans || true
          
          # 6. Запускаем сборку и старт с явным указанием имени проекта
          docker-compose -p realtime_ticker -f docker/docker-compose.yml up -d --build